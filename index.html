<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balanza numérica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FFFFFF; --ink:#231F20; --muted:#5E6B72; --line:#E5DFF2;
  --mate:#359ECF; --mate-d:#2479A3; --verde:#81CE4F; --verde-d:#58A62B;
  --crema:#FEF1C8; --lila:#E5DFF2; --lila-s:#F4F1FA; --morado:#A9339C; --naranja:#F68712; --amarillo:#FBBF09;
  --cielo:#3789B5; --cielo-d:#2C77A0; --hilo:rgba(255,255,255,.85);
  --ok:#3E8E1F; --hint:#9A5200;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0F2230; --ink:#EEF3F6; --muted:#A6B7C1; --line:#2B4556;
    --mate:#5DB6E2; --mate-d:#3E9BCB; --crema:#3A3320; --lila:#2D3150; --lila-s:#18303F;
    --cielo:#1E5F84; --cielo-d:#174E6E; --ok:#8FDB64; --hint:#F5C06B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F2230; --ink:#EEF3F6; --muted:#A6B7C1; --line:#2B4556;
  --mate:#5DB6E2; --mate-d:#3E9BCB; --crema:#3A3320; --lila:#2D3150; --lila-s:#18303F;
  --cielo:#1E5F84; --cielo-d:#174E6E; --ok:#8FDB64; --hint:#F5C06B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{height:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"Lexend","Segoe UI",system-ui,sans-serif; font-size:18px; line-height:1.4;
  -webkit-user-select:none; user-select:none;
}
.wrap{max-width:1280px; height:100%; margin:0 auto; padding:12px 18px 12px; display:flex; flex-direction:column}
.wrap > *{flex:none}

header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 20px; margin-bottom:10px}
.title{display:flex; align-items:center; gap:14px}
.badge{width:54px; height:54px; border-radius:50%; background:var(--verde); display:grid; place-items:center; flex:none}
.badge .si{width:34px; height:32px}
h1{font-size:clamp(26px,4.6vw,36px); font-weight:700; color:var(--mate); margin:0; line-height:1.1}
.sub{margin:2px 0 0; font-size:15px; color:var(--ink)}
.sub b{font-weight:600}
.modes{display:inline-flex; background:var(--lila-s); border:2px solid var(--lila); border-radius:999px; padding:4px}
.modes button{font:inherit; font-weight:600; font-size:16px; border:0; background:none; color:var(--muted); padding:8px 18px; border-radius:999px; cursor:pointer; min-height:44px}
.modes button[aria-pressed="true"]{background:var(--mate); color:#fff}

/* Banda de reto, como la pregunta inicial del libro */
.reto{display:none; position:relative; background:var(--crema); border-radius:22px; padding:10px 18px 10px 74px; margin:0 0 10px 18px; align-items:center; gap:10px 16px; flex-wrap:wrap; min-height:72px}
body.mode-retos .reto{display:flex}
.reto-icon{position:absolute; left:-20px; top:50%; width:76px; height:76px; transform:translateY(-50%)}
.reto-icon svg{width:100%; height:100%; overflow:visible}
.reto .ic-done{display:none}
.reto.done .ic-done{display:block}
.reto.done .ic-q{display:none}
.reto-text{flex:1 1 300px}
.reto-num{font-size:14px; color:var(--muted); margin:0}
.reto-prompt{font-size:19px; font-weight:400; margin:2px 0 0}
.found{margin:4px 0 0; font-size:15px; color:var(--muted)}
.found:empty{display:none}
.reto-actions{display:flex; gap:8px; flex-wrap:wrap}

.btn{font:inherit; font-weight:600; font-size:15px; min-height:44px; padding:8px 16px; border-radius:12px; border:2px solid var(--mate); background:var(--page); color:var(--mate); cursor:pointer}
.btn.primary{background:var(--mate); color:#fff}
.btn:focus-visible,.modes button:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

/* Cielo */
.sky{position:relative; flex:1 1 auto !important; min-height:240px; display:flex; align-items:center; justify-content:center; background:var(--cielo); border-radius:28px; overflow:hidden; padding:8px}
.sky-deco{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.deco-corner{position:absolute; width:clamp(120px,18%,240px); height:auto; aspect-ratio:240/70; pointer-events:none; overflow:visible}
.balance{position:relative; flex:none; width:100%; height:400px; margin:0; --t:0deg; --h:240px; --pan:220px; --u:42px}
.balance img{display:block; pointer-events:none; -webkit-user-drag:none}
.post{position:absolute; left:50%; transform:translateX(-50%); z-index:1}
.glow{position:absolute; left:50%; top:var(--py,70px); width:var(--gw,140px); height:var(--gw,140px); transform:translate(-50%,-50%) scale(.5); border-radius:50%; background:radial-gradient(circle, rgba(255,225,110,.9) 0%, rgba(255,214,90,.45) 38%, rgba(255,214,90,0) 70%); opacity:0; z-index:2; pointer-events:none; transition:opacity .35s, transform .5s cubic-bezier(.34,1.6,.5,1)}
.balance.level .glow{opacity:1; transform:translate(-50%,-50%) scale(1)}
.beam{position:absolute; left:50%; top:var(--py,70px); z-index:4; transform:translate(-50%,-50%) rotate(calc(-1 * var(--t))); transform-origin:50% 50%; transition:transform .7s cubic-bezier(.34,1.3,.5,1)}
.pivot{position:absolute; left:50%; top:var(--py,70px); width:var(--rw,110px); height:var(--rw,110px); transform:translate(-50%,-50%); pointer-events:none; z-index:5}
.pivot svg{width:100%; height:100%; overflow:visible}
.pivot .rays{opacity:0; transform-origin:0 0; transform:scale(.7); transition:opacity .35s, transform .5s cubic-bezier(.34,1.6,.5,1)}
.balance.level .pivot .rays{opacity:1; transform:scale(1)}

.pan{position:absolute; top:var(--pt,60px); width:var(--pan); height:calc(var(--pan) * 1.076); transform:translate(-50%, var(--dy,0px)); transition:transform .7s cubic-bezier(.34,1.3,.5,1); cursor:pointer; outline:none; z-index:3}
#panL{left:calc(50% - var(--h))}
#panR{left:calc(50% + var(--h))}
.pan > img{position:absolute; inset:0; width:100%; height:100%; transition:filter .2s}
.pan.over > img,.pan.armed:hover > img{filter:drop-shadow(0 0 10px rgba(255,214,90,.95))}
.pan:focus-visible > img{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff)}
.content{position:absolute; left:13%; right:13%; bottom:25.5%; top:24%; display:flex; flex-wrap:wrap-reverse; align-content:flex-start; align-items:flex-end; justify-content:center; gap:2px 9px}
.stars{display:flex; flex-wrap:wrap-reverse; justify-content:center; gap:0 1px; max-width:calc(var(--u) * 2.6)}

/* Piezas */
.item{font:inherit; border:0; background:none; padding:0; margin:0; color:inherit; cursor:grab; touch-action:none; display:inline-flex; flex-direction:column; align-items:center; line-height:1}
.num .d{
  font-weight:800; font-size:var(--u); color:var(--c); line-height:.95; letter-spacing:-.02em;
  -webkit-text-stroke:calc(var(--u) * .12) #FFFFFF; paint-order:stroke fill;
  filter:drop-shadow(0 3px 0 var(--cd));
}
.dots{display:none; flex-wrap:wrap; width:40px; gap:2px; margin-top:calc(var(--u) * .16 + 2px); justify-content:center}
body.show-values .dots{display:flex}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--c); box-shadow:0 0 0 1.5px #FFFFFF}
.unit .si{width:calc(var(--u) * .66); height:calc(var(--u) * .62); display:block}
.item.locked{cursor:default; position:relative}
.item.locked::after{content:""; position:absolute; inset:-4px -3px; border:2px dashed rgba(255,255,255,.75); border-radius:10px}
.item.src-hidden{opacity:.25}
.item:focus-visible{outline:3px solid var(--amarillo); outline-offset:3px; border-radius:8px}
.ghost{position:fixed; left:0; top:0; z-index:50; pointer-events:none; transform:translate(-50%,-50%) scale(1.15); --u:46px}

/* Escritura */
.writing{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin:8px 0 0; min-height:52px}
body:not(.show-writing) .writing{visibility:hidden}
.w{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px 8px; font-size:30px; font-weight:600}
.w .op{color:var(--mate); font-weight:500}
.w .q{display:inline-grid; place-items:center; min-width:40px; height:44px; border:2px dashed var(--naranja); border-radius:10px; color:var(--naranja); font-size:26px}
.w .empty{font-size:16px; color:var(--muted); font-weight:300}
.w .ws{display:inline-flex; align-items:center; gap:4px}
.w .ws .si{width:24px; height:22px}
.sign{font-size:38px; font-weight:700; width:58px; height:58px; display:grid; place-items:center; border-radius:50%; background:var(--lila-s); border:2px solid var(--lila); color:var(--mate)}
.sign.goal{color:var(--naranja); border:2px dashed var(--naranja); background:transparent}

.status{display:flex; justify-content:center; align-items:center; gap:8px; text-align:center; min-height:28px; margin:2px 0 8px; font-size:17px; color:var(--muted)}
.status.ok{color:var(--ok); font-weight:600}
.status.hint{color:var(--hint)}
.status .si{width:28px; height:26px; flex:none}

/* Bandeja, como el recuadro lateral del libro */
.tray{background:var(--page); border:2px solid var(--lila); border-radius:20px; padding:12px 14px 14px; box-shadow:0 4px 0 var(--lila); --u:clamp(28px, 4.4vh, 40px)}
.tray-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:stretch}
.tray .item{min-width:calc(var(--u) * 1.35); min-height:calc(var(--u) * 1.6); padding:6px; border-radius:14px; background:var(--lila-s); justify-content:center; border:2px solid transparent}
.tray .item[aria-pressed="true"]{border-color:var(--mate); background:var(--page)}
.tray .unit{flex-direction:row; gap:8px; padding:8px 14px; font-size:16px; font-weight:600; color:var(--ink)}
.tray .unit .si{width:30px; height:28px}
.sep{flex:0 0 2px; width:2px; background:var(--lila); border-radius:1px; margin:4px}

.work{flex:1 1 auto !important; min-height:0; display:flex; flex-direction:column}
.stagecol{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.stagecol > *{flex:none}
@media (min-width:900px) and (orientation:landscape){
  .work{flex-direction:row; gap:16px; align-items:stretch}
  .tray{align-self:center; padding:12px}
  .tray .tray-row{display:grid; grid-template-columns:repeat(2, auto); gap:8px}
  .tray .sep{display:none}
  .tray .unit{grid-column:1 / -1; justify-content:center}
}
.options{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:4px 16px; margin:0}
.toggles{display:flex; flex-wrap:wrap; gap:0 18px}
.toggles label{display:inline-flex; align-items:center; gap:8px; font-size:15px; cursor:pointer; min-height:36px}
.toggles input{width:22px; height:22px; accent-color:var(--mate)}
body.mode-retos #clearBtn{display:none}

@media (max-width:640px), (max-height:560px){
  html,body,.wrap{height:auto}
  .sky{min-height:0}
  .work,.stagecol{flex:none !important}
}
@media (max-width:560px){
  .w{font-size:24px}
  .sign{width:48px; height:48px; font-size:30px}
  .tray{--u:31px}
  .tray .item{min-width:44px; min-height:56px}
  .reto{padding-left:60px}
  .reto-icon{width:64px; height:64px; left:-16px}
}
@media (prefers-reduced-motion:reduce){
  .beam,.pan,.pivot .rays,.glow{transition:none}
}
</style>

<script>
(function(){
  const COLORS = {
    1:['#E8443A','#A72A22'], 2:['#F68712','#B35C05'], 3:['#F2B705','#A87C00'], 4:['#81CE4F','#4E9A2A'],
    5:['#4AA389','#2D7360'], 6:['#359ECF','#21729B'], 7:['#8B6BC9','#5E4497'], 8:['#A9339C','#76206D'],
    9:['#E40B8D','#A00762'], 10:['#3A586C','#233746']
  };
  const LIMITS = {num:5, star:20};
  const $ = s => document.querySelector(s);
  const balance = $('#balance'), panEls = {L:$('#panL'), R:$('#panR')};
  const sideName = {L:'izquierda', R:'derecha'};
  const STAR = '<span class="si" aria-hidden="true"></span>';
  const plural = n => n===1 ? 'estrella' : 'estrellas';

  let uid = 0;
  const state = {mode:'libre', pans:{L:[],R:[]}, reto:null, solved:false, solvedCount:0, retoN:0, selected:null, found:[], lastType:null, msg:null, lastWin:null};
  let H = 240; const TMAX = 10;

  const mk = (type, v, locked=false) => ({id:++uid, type, v, locked});
  const weight = s => state.pans[s].reduce((a,i)=>a+(i.type==='num'?i.v:1),0);
  const added = s => state.pans[s].filter(i=>!i.locked);
  const count = (s,type) => state.pans[s].filter(i=>i.type===type).length;

  function makePiece(type, v){
    const b = document.createElement('button');
    b.type = 'button';
    if(type==='num'){
      b.className = 'item num';
      b.style.setProperty('--c', COLORS[v][0]);
      b.style.setProperty('--cd', COLORS[v][1]);
      const d = document.createElement('span'); d.className='d'; d.textContent=v; b.append(d);
      const dots = document.createElement('span'); dots.className='dots'; dots.setAttribute('aria-hidden','true');
      for(let k=0;k<v;k++) dots.append(document.createElement('i'));
      b.append(dots);
    } else {
      b.className = 'item unit';
      b.innerHTML = STAR;
    }
    return b;
  }
  const label = (type,v) => type==='num' ? `el ${v}` : 'una estrella';

  function buildTray(){
    const tray = $('#tray'); tray.innerHTML='';
    for(let v=1; v<=10; v++){
      const b = makePiece('num', v);
      b.setAttribute('aria-label', `Número ${v}`);
      b.dataset.key = 'num:'+v;
      attachDrag(b, {from:'tray', type:'num', v});
      tray.append(b);
    }
    const sep = document.createElement('div'); sep.className='sep'; tray.append(sep);
    const c = makePiece('star', 1);
    c.dataset.key='star';
    c.setAttribute('aria-label','Estrella, vale 1');
    c.append(document.createTextNode('Estrella'));
    attachDrag(c, {from:'tray', type:'star', v:1});
    tray.append(c);
  }

  /* Arrastre */
  let drag = null;
  function attachDrag(el, src){
    el.addEventListener('pointerdown', e=>{
      if(e.button!==0) return;
      if(src.from==='pan' && src.locked) return;
      e.preventDefault();
      drag = {el, src, x0:e.clientX, y0:e.clientY, active:false, ghost:null};
    });
    el.addEventListener('click', e=>{ if(e.detail===0) tap(src); e.stopPropagation(); });
  }
  window.addEventListener('pointermove', e=>{
    if(!drag) return;
    if(!drag.active){
      if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 6) return;
      drag.active = true;
      const s = drag.src;
      drag.ghost = makePiece(s.type, s.v);
      drag.ghost.classList.add('ghost');
      drag.ghost.setAttribute('aria-hidden','true');
      document.body.append(drag.ghost);
      if(s.from==='pan') drag.el.classList.add('src-hidden');
    }
    drag.ghost.style.left = e.clientX+'px';
    drag.ghost.style.top = e.clientY+'px';
    const t = panAt(e.clientX, e.clientY);
    for(const k in panEls) panEls[k].classList.toggle('over', k===t);
  });
  window.addEventListener('pointerup', e=>{
    if(!drag) return;
    const d = drag; drag = null;
    if(!d.active){ tap(d.src); return; }
    d.ghost.remove();
    for(const k in panEls) panEls[k].classList.remove('over');
    const target = panAt(e.clientX, e.clientY);
    const s = d.src;
    if(s.from==='tray'){
      if(target) place(target, s.type, s.v);
    } else {
      if(target===s.side){ d.el.classList.remove('src-hidden'); return; }
      if(target && !canAdd(target, s.type)){ d.el.classList.remove('src-hidden'); fullMsg(); return; }
      removeItem(s.side, s.id, false);
      if(target) place(target, s.type, s.v, false);
      render();
    }
  });
  window.addEventListener('pointercancel', ()=>{
    if(drag && drag.ghost) drag.ghost.remove();
    if(drag) drag.el.classList.remove('src-hidden');
    for(const k in panEls) panEls[k].classList.remove('over');
    drag = null;
  });
  function panAt(x,y){
    for(const k of ['L','R']){
      const r = panEls[k].getBoundingClientRect(), m = 26;
      if(x>=r.left-m && x<=r.right+m && y>=r.top-m && y<=r.bottom+m) return k;
    }
    return null;
  }
  function tap(src){
    if(src.from==='tray'){
      const key = src.type==='num' ? 'num:'+src.v : 'star';
      state.selected = state.selected===key ? null : key;
      state.msg = null; render();
    } else if(!src.locked){
      removeItem(src.side, src.id);
    }
  }
  function canAdd(side, type){ return count(side,type) < LIMITS[type]; }
  function fullMsg(){ state.msg = {kind:'hint', text:'Ese platillo ya está lleno. Quita algo antes de poner más.'}; render(); }
  function place(side, type, v, doRender=true){
    if(!canAdd(side, type)){ fullMsg(); return; }
    state.pans[side].push(mk(type, v));
    state.msg = null;
    if(doRender) render();
  }
  function removeItem(side, id, doRender=true){
    state.pans[side] = state.pans[side].filter(i=>i.id!==id);
    state.msg = null;
    if(doRender) render();
  }
  for(const k of ['L','R']){
    const p = panEls[k];
    const act = ()=>{
      if(!state.selected) return;
      const [type, v] = state.selected==='star' ? ['star',1] : ['num', +state.selected.split(':')[1]];
      place(k, type, v);
    };
    p.addEventListener('click', act);
    p.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
  }
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && state.selected){ state.selected=null; render(); } });

  /* Retos */
  const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  function newReto(){
    const types = ['representa','faltante','iguala','descompon'].filter(t=>t!==state.lastType);
    const type = types[rnd(0, types.length-1)];
    state.lastType = type;
    let r;
    if(type==='representa'){
      const n = rnd(3,10);
      r = {type, n, side:'L', L:[], R:[mk('num',n,true)], prompt:'Pon estrellas en el platillo vacío hasta que la balanza quede en equilibrio.'};
    } else if(type==='faltante'){
      const c = rnd(4,10), a = rnd(1,c-1);
      r = {type, a, c, side:'L', L:[mk('num',a,true)], R:[mk('num',c,true)], prompt:`¿Qué número falta? Ponlo junto al ${a} para equilibrar la balanza.`};
    } else if(type==='iguala'){
      let a,b,c,x;
      do{ a=rnd(2,8); b=rnd(2,8); c=rnd(2,10); x=a+b-c; } while(x<1 || x>9);
      r = {type, a, b, c, side:'R', L:[mk('num',a,true), mk('num',b,true)], R:[mk('num',c,true)], prompt:'Agrega un número al platillo de la derecha para equilibrar la balanza.'};
    } else {
      const n = rnd(5,10);
      r = {type, n, side:'L', L:[], R:[mk('num',n,true)], prompt:`Usa dos números para equilibrar el ${n}.`};
    }
    state.reto = r; state.solved = false; state.found = []; state.retoN++; state.lastWin = null;
    state.pans = {L:r.L, R:r.R}; state.msg = null; state.selected = null;
    render();
  }
  function resetReto(){
    state.pans.L = state.pans.L.filter(i=>i.locked);
    state.pans.R = state.pans.R.filter(i=>i.locked);
    state.solved = false; state.msg = null; state.lastWin = null;
    render();
  }
  function checkReto(){
    const r = state.reto;
    if(!r || state.solved) return null;
    const other = r.side==='L' ? 'R' : 'L';
    const a = added(r.side), o = added(other);
    if(!a.length && !o.length) return null;
    if(o.length) return {kind:'hint', text:`En este reto solo agregas piezas al platillo de la ${sideName[r.side]}.`};
    const d = weight('L') - weight('R');
    if(d!==0) return {kind:'', text: d>0 ? 'El platillo de la izquierda vale más.' : 'El platillo de la derecha vale más.'};
    const nums = a.filter(i=>i.type==='num'), stars = a.filter(i=>i.type==='star');
    if(r.type==='representa'){
      if(nums.length) return {kind:'hint', text:'Está en equilibrio, pero este reto es solo con estrellas. Quita los números.'};
      return win(`¡Lo lograste! ${stars.length} ${plural(stars.length)} valen lo mismo que el ${r.n}.`);
    }
    if(r.type==='faltante' || r.type==='iguala'){
      if(stars.length || nums.length!==1) return {kind:'hint', text:'Está en equilibrio, pero el reto pide usar un solo número, sin estrellas.'};
      const x = nums[0].v;
      return win(r.type==='faltante' ? `¡Muy bien! ${r.a} + ${x} = ${r.c}` : `¡Muy bien! ${r.a} + ${r.b} = ${r.c} + ${x}`);
    }
    if(r.type==='descompon'){
      if(stars.length || nums.length!==2) return {kind:'hint', text:'Está en equilibrio, pero el reto pide usar exactamente dos números, sin estrellas.'};
      const p = nums[0].v, q = nums[1].v, key = [p,q].sort((m,n)=>m-n).join('+');
      if(state.found.some(f=>f.key===key)) return {kind:'hint', text:'Esa forma ya la encontraste. Prueba con otros dos números.'};
      state.found.push({key, text:`${p} + ${q}`});
      return win(`¡Muy bien! ${p} + ${q} = ${r.n}. ¿Encuentras otra forma?`);
    }
    return null;
  }
  function win(text){
    if(!(state.reto.type==='descompon' && state.found.length>1)) state.solvedCount++;
    state.solved = true;
    return {kind:'ok', text};
  }

  /* Render */
  function placeholder(side){
    const r = state.reto;
    return state.mode==='retos' && r && !state.solved && r.side===side && added(side).length===0;
  }
  function writing(side){
    const its = state.pans[side];
    const parts = its.filter(i=>i.type==='num').map(i=>`<span>${i.v}</span>`);
    const c = count(side,'star');
    if(c) parts.push(`<span class="ws" aria-label="${c} ${plural(c)}">${STAR}${c}</span>`);
    if(placeholder(side)) parts.push('<span class="q" aria-label="falta">?</span>');
    return parts.length ? parts.join('<span class="op">+</span>') : '<span class="empty">vacío</span>';
  }
  function renderPan(side){
    const el = panEls[side].querySelector('.content');
    el.innerHTML = '';
    const stars = document.createElement('div'); stars.className='stars';
    for(const it of state.pans[side]){
      const b = makePiece(it.type, it.v);
      if(it.locked){
        b.classList.add('locked'); b.tabIndex = -1;
        b.setAttribute('aria-label', `${it.v}, fijo`);
      } else {
        b.setAttribute('aria-label', `Quitar ${label(it.type,it.v)} del platillo de la ${sideName[side]}`);
      }
      attachDrag(b, {from:'pan', side, id:it.id, type:it.type, v:it.v, locked:it.locked});
      if(it.type==='star') stars.append(b); else el.append(b);
    }
    if(stars.children.length) el.append(stars);
  }
  function render(){
    renderPan('L'); renderPan('R');
    const wl = weight('L'), wr = weight('R'), d = wl - wr;
    const t = d===0 ? 0 : Math.sign(d) * Math.min(TMAX, 4 + 1*Math.abs(d));
    balance.style.setProperty('--t', t+'deg');
    const dy = H * Math.sin(t*Math.PI/180);
    panEls.L.style.setProperty('--dy', dy+'px');
    panEls.R.style.setProperty('--dy', (-dy)+'px');
    balance.classList.toggle('level', d===0 && wl>0);

    $('#wL').innerHTML = writing('L');
    $('#wR').innerHTML = writing('R');
    const sign = $('#sign');
    const goal = placeholder('L') || placeholder('R');
    sign.textContent = goal ? '=' : (d===0 ? '=' : d>0 ? '>' : '<');
    sign.classList.toggle('goal', goal);
    sign.setAttribute('aria-label', goal ? 'igual (meta)' : d===0 ? 'igual a' : d>0 ? 'mayor que' : 'menor que');

    document.querySelectorAll('#tray .item').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.key===state.selected)));
    for(const k in panEls) panEls[k].classList.toggle('armed', !!state.selected);

    let msg = state.msg;
    if(state.mode==='retos'){
      const res = checkReto();
      if(res && res.kind==='ok') state.lastWin = res;
      if(!msg) msg = res || (state.solved ? state.lastWin : null);
      renderReto();
    }
    if(!msg){
      if(state.selected){
        const what = state.selected==='star' ? 'la estrella' : 'el '+state.selected.split(':')[1];
        msg = {kind:'', text:`Toca un platillo para poner ${what}.`};
      } else if(wl===0 && wr===0){
        msg = {kind:'', text:'Arrastra un número o una estrella a un platillo.'};
      } else if(state.mode==='retos'){
        msg = {kind:'', text:''};
      } else if(d===0){
        msg = {kind:'ok', text:'Los dos platillos valen lo mismo: la balanza está en equilibrio.'};
      } else {
        msg = {kind:'', text: d>0 ? 'El platillo de la izquierda vale más.' : 'El platillo de la derecha vale más.'};
      }
    }
    const st = $('#status');
    st.className = 'status' + (msg.kind ? ' '+msg.kind : '');
    st.innerHTML = '';
    if(msg.kind==='ok'){
      st.insertAdjacentHTML('beforeend','<span class="si" aria-hidden="true"></span>');
    }
    st.append(document.createTextNode(msg.text));
  }
  function renderReto(){
    const r = state.reto; if(!r) return;
    $('#reto').classList.toggle('done', state.solved);
    $('#retoNum').textContent = `Reto ${state.retoN}. Resueltos: ${state.solvedCount}`;
    $('#retoPrompt').textContent = r.prompt;
    $('#found').textContent = (r.type==='descompon' && state.found.length) ? `Formas que encontraste: ${state.found.map(f=>f.text).join(', ')}` : '';
    const box = $('#retoActions'); box.innerHTML='';
    const btn = (txt, cls, fn) => { const b=document.createElement('button'); b.type='button'; b.className='btn '+cls; b.textContent=txt; b.onclick=fn; box.append(b); };
    if(state.solved){
      if(r.type==='descompon') btn('Buscar otra forma','', resetReto);
      btn('Siguiente reto','primary', newReto);
    } else {
      btn('Empezar de nuevo','', resetReto);
      btn('Otro reto','', newReto);
    }
  }

  function setMode(m){
    state.mode = m;
    document.body.classList.toggle('mode-retos', m==='retos');
    document.body.classList.toggle('mode-libre', m==='libre');
    $('#modeLibre').setAttribute('aria-pressed', String(m==='libre'));
    $('#modeRetos').setAttribute('aria-pressed', String(m==='retos'));
    state.selected = null; state.msg = null;
    if(m==='retos'){ state.retoN = 0; state.solvedCount = 0; newReto(); }
    else { state.reto = null; state.pans = {L:[],R:[]}; render(); }
  }
  $('#modeLibre').onclick = ()=>{ if(state.mode!=='libre') setMode('libre'); };
  $('#modeRetos').onclick = ()=>{ if(state.mode!=='retos') setMode('retos'); };
  $('#clearBtn').onclick = ()=>{ state.pans = {L:[],R:[]}; state.msg=null; render(); };
  $('#optWriting').onchange = e => document.body.classList.toggle('show-writing', e.target.checked);
  $('#optValues').onchange = e => document.body.classList.toggle('show-values', e.target.checked);

  function geom(we){
    const pan = Math.max(120, Math.min(340, we*0.36)), panH = pan*1.076;
    const h = we/2 - pan/2 - 6;
    const dyMax = h*Math.sin(TMAX*Math.PI/180);
    const bw = 2*h/0.920, bhh = bw*208/1400;          // la distancia entre esferas es el 92 % de la barra
    const PY = Math.round(dyMax + bhh/2 + 10);
    const bh = Math.round(PY - 0.037*panH + panH + dyMax + 14);
    return {we, pan, panH, h, bw, bhh, PY, bh};
  }
  const sky = document.querySelector('.sky');
  let lastKey = '';
  function layout(){
    const cs = getComputedStyle(sky);
    const aw = sky.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const fitHeight = window.innerWidth > 640 && window.innerHeight > 560;
    const ah = fitHeight ? sky.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) : Infinity;
    let g = geom(Math.min(aw - 16, 1240));
    for(let i=0; i<6 && g.bh > ah; i++) g = geom(g.we * ah / g.bh);
    const key = [g.we, g.bh].map(Math.round).join('x');
    if(key===lastKey) return;
    lastKey = key;
    H = g.h;
    balance.style.width = g.we+'px';
    balance.style.height = g.bh+'px';
    balance.style.setProperty('--py', g.PY+'px');
    balance.style.setProperty('--h', g.h+'px');
    balance.style.setProperty('--pan', g.pan+'px');
    balance.style.setProperty('--u', Math.round(g.pan*0.21)+'px');
    const beam = $('#beam'); beam.style.width = g.bw+'px'; beam.style.height = g.bhh+'px';
    balance.style.setProperty('--rw', (g.bhh*1.45)+'px');
    balance.style.setProperty('--gw', (g.bhh*2.4)+'px');
    // poste: la esfera superior (3.8 % de su altura) coincide con el pivote
    const ph = (g.bh - g.PY)/(1-0.038);
    const post = $('#post'); post.style.height = ph+'px'; post.style.width = (ph*341/700)+'px'; post.style.top = (g.PY - 0.038*ph)+'px';
    // platillo: el centro de la argolla (3.7 % de su altura) cuelga del centro de la esfera
    balance.style.setProperty('--pt', (g.PY - 0.037*g.panH)+'px');
    render();
  }
  window.addEventListener('resize', layout);
  if(window.ResizeObserver) new ResizeObserver(()=>layout()).observe(sky);
  buildTray();
  layout();
})();
</script>
</body>
</html>
